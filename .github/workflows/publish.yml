# Publishes this package to npm as n8n-nodes-spicrawl.
#
# n8n verifies a community node only when it was published from GitHub Actions
# with an npm provenance attestation, so this workflow is the only way a
# version should reach npm. The attestation needs package.json "repository" to
# match this GitHub repo (OfficialSpicrawl/n8n-nodes-spicrawl).
#
# Auth is npm trusted publishing (OIDC): the package's Trusted Publisher on
# npmjs.com names this repo and this workflow file, so no token or secret is
# needed. It requires `id-token: write` and npm 11.5.1 or newer. Provenance is
# attached automatically.
#
# Release: bump "version" in package.json, add a "## X.Y.Z" section to
# CHANGELOG.md, merge to main, then push the tag vX.Y.Z on the merged commit.
# The tag must match the package version. This workflow never creates tags. A
# prerelease version (e.g. 0.2.0-beta.1) is published under the `next` dist-tag
# so `npm install n8n-nodes-spicrawl` keeps getting latest.
#
# To retry a failed publish, re-run the failed run from the Actions tab.

name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: npm 11.5.1+ (trusted publishing)
        run: npm install -g npm@^11.5.1
      - name: install
        run: npm ci --no-audit --no-fund
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build
      - name: test
        run: npm test
      - name: tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: already on npm?
        id: check
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: publish
        if: steps.check.outputs.publish == 'true'
        env:
          # package.json's prepublishOnly (n8n-node prerelease) refuses a bare
          # `npm publish` unless this is set; `n8n-node release` sets it in CI too.
          RELEASE_MODE: 'true'
        run: |
          npm publish --provenance --access public --tag "${{ steps.check.outputs.tag }}"
